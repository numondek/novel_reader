name: novel_reader
description: "A Flutter novel reader app with scraping, translation, TTS and offline library."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  auto_route: 10.1.2

  dio: ^5.8.0+1
  html: ^0.15.5

  flutter_inappwebview: ^6.1.0

  flutter_tts: ^4.2.2

  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  connectivity_plus: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  auto_route_generator: ^10.0.1

flutter:
  uses-material-design: true
